<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Pàgina de contacte amb nosaltres">
    <link rel="icon" href="C:\Users\roger\Documents\vs code\logos\pantalla-de-cine.png" type="image/x-icon">
    <title>Contacte amb nosaltres</title>
</head>
<body>
    <header>
        <h1>Contacte amb nosaltres</h1>
    </header>
    <main>
        <section>
            <h2>Informació de contacte</h2>
            <p>Si tens alguna pregunta o suggeriment, no dubtis en posar-te en contacte amb nosaltres.</p>
            <form action="mailto:info@nostalgi.cat" method="post" enctype="text/plain">
                <label for="nom">Nom:</label>
                <input type="text" id="nom" name="nom" required>
                <br>
                <br>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                <br>
                <br>
                <label for="missatge">Missatge:</label>
                <br>
                <textarea id="missatge" name="missatge" rows="5" required></textarea>
                <br>
                <br>
                <button type="submit">Enviar missatge</button>
            </form>
        </section>
    </main>
</body>
</html>
